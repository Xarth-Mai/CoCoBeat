[package]
name = "cocobeat-brand-validation"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "cocobeat-brand-validation"
path = "main.rs"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "bevy_gilrs", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_ui_render", "default_font", "multi_threaded", "x11", "wayland", "png"] }
kira = { version = "=0.12.5", default-features = false, features = ["cpal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
