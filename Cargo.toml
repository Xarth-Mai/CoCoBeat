[workspace]
resolver = "3"
members = [
    "apps/cocobeat-game",
    "crates/cocobeat-schema",
    "crates/cocobeat-core",
    "crates/cocobeat-runtime",
    "crates/cocobeat-replay",
    "crates/cocobeat-media",
    "crates/cocobeat-stage",
    "crates/cocobeat-editor",
    "crates/cocobeat-net",
    "tools/cocobeat-lab",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/Xarth-Mai/CoCoBeat"
publish = false

[workspace.dependencies]
cocobeat-schema = { path = "crates/cocobeat-schema" }
cocobeat-core = { path = "crates/cocobeat-core" }
cocobeat-runtime = { path = "crates/cocobeat-runtime" }
cocobeat-replay = { path = "crates/cocobeat-replay" }
cocobeat-media = { path = "crates/cocobeat-media" }
cocobeat-stage = { path = "crates/cocobeat-stage" }
cocobeat-editor = { path = "crates/cocobeat-editor" }
cocobeat-net = { path = "crates/cocobeat-net" }
quinn = { version = "0", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
symphonia = { version = "0", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "all-meta"] }
oximedia-audio = { version = "0", default-features = false }
oximedia-core = "0"
blake3 = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bevy = { version = "0", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "bevy_gilrs", "bevy_render", "bevy_core_pipeline", "bevy_post_process", "bevy_pbr", "bevy_ui_render", "multi_threaded", "x11", "wayland", "png"] }
fontique = { version = "0", default-features = false, features = ["std"] }
kira = { version = "0", default-features = false, features = ["cpal"] }
embed-resource = "3"
winit = { version = "0", default-features = false }
sys-locale = "0"
winsafe = { version = "0", default-features = false, features = ["user"] }
x11rb = { version = "0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Shipping builds prioritize runtime performance over compilation speed.
# Keep the target's default CPU baseline so artifacts run on other machines.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = 0
incremental = false
