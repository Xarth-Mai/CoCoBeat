name: Lightweight CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &source-paths
      - '**/*.rs'
      - 'vendor/**/*.c'
      - 'vendor/**/*.h'
      - 'crates/cocobeat-btt/**/*.c'
      - 'crates/cocobeat-btt/**/*.h'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - '.cargo/**'
      - .gitattributes
      - 'assets/i18n/**'
      - 'assets/fonts/**'
      - 'assets/flags/**'
      - 'testdata/synthetic/media-import/**'
      - '.github/workflows/**'
  pull_request:
    paths: *source-paths

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install latest stable Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt clippy --toolchain stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: light-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ hashFiles('**/*.rs', 'vendor/**/*.c', 'vendor/**/*.h', 'crates/cocobeat-btt/**/*.c', 'crates/cocobeat-btt/**/*.h') }}
          restore-keys: |
            light-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
            light-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      - run: cargo fmt --all -- --check
      - run: cargo xtask boundaries
      # Rules, source decoding, headless networking and tooling; no engine/device/GPU compilation
      - run: cargo clippy --locked -p cocobeat-schema -p cocobeat-core -p cocobeat-replay -p cocobeat-media -p cocobeat-btt -p cocobeat-stage -p cocobeat-editor -p cocobeat-net -p xtask --all-targets -- -D warnings
      - run: cargo test --locked -p cocobeat-schema -p cocobeat-core -p cocobeat-replay -p cocobeat-media -p cocobeat-btt -p cocobeat-stage -p cocobeat-editor -p cocobeat-net -p xtask
