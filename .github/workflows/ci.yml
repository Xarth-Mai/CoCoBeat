name: Lightweight CI

on:
  push:
    branches: [main]
    paths: &source-paths
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - '.cargo/**'
      - 'assets/i18n/**'
      - 'assets/fonts/**'
      - 'assets/flags/**'
      - '.github/workflows/**'
  pull_request:
    paths: *source-paths

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install latest stable Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt clippy --toolchain stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: light-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            light-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
      - run: cargo fmt --all -- --check
      - run: cargo xtask boundaries
      # Pure rules and tooling only: no engine/audio/GPU compilation on each PR.
      - run: cargo clippy --locked -p cocobeat-schema -p cocobeat-core -p cocobeat-replay -p xtask --all-targets -- -D warnings
      - run: cargo test --locked -p cocobeat-schema -p cocobeat-core -p cocobeat-replay -p xtask
