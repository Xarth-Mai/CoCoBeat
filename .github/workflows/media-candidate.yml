name: Native media candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
      CARGO_TARGET_DIR: target/media-candidate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install latest stable native Rust
        id: rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc -vV
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/media-candidate
          key: media-candidate-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-${{ hashFiles('**/*.rs', 'vendor/**/*.c', 'vendor/**/*.h') }}
          restore-keys: |
            media-candidate-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-
            media-candidate-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-
      - name: Test native media adapter
        run: |
          mkdir -p target/native-vorbis-logs
          cargo test --locked --release -p cocobeat-media 2>&1 | tee target/native-vorbis-logs/test.log
      - name: Build optimized media QA examples
        run: cargo build --release --locked -p cocobeat-media --examples 2>&1 | tee target/native-vorbis-logs/build.log
      - name: Verify complete native encode and readback
        timeout-minutes: 20
        run: python tools/native-vorbis-check/native.py "$CARGO_TARGET_DIR/release/examples" target/native-vorbis-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media-candidate-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/native-vorbis-logs
            target/native-vorbis-evidence
            !target/native-vorbis-evidence/**/*.wav
            !target/native-vorbis-evidence/**/*.f32le
          if-no-files-found: error
          retention-days: 14
